// game-core — pure game logic. No Spring Boot.
//
// DEVIATION (team decision, recorded in CLAUDE.md): libGDX core IS a dependency
// here so that Architecture.md §5 signatures (SpriteBatch, Vector2) can be kept
// literally. This overrides the original "zero libGDX in game-core" rule.
plugins {
    id 'java-library'
}

dependencies {
    api libs.gdx.core
}
