# In-memory H2 for tests so they don't need a running MySQL instance.
spring:
  datasource:
    url: jdbc:h2:mem:infectedhour-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-only-secret-not-for-prod-use-32bytes-min
